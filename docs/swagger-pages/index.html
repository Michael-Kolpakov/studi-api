<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teachio API Documentation</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        background: #f4f7f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #1b1f23;
      }

      .topbar {
        padding: 12px 18px;
        background: #0f3d57;
        color: #ffffff;
        font-size: 14px;
        line-height: 1.4;
        border-bottom: 3px solid #f2a365;
      }

      #swagger-ui {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      Teachio API | Static Swagger documentation published by GitHub Actions
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "./swagger.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
      });
    </script>
  </body>
</html>
