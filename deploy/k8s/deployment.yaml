apiVersion: apps/v1
kind: Deployment
metadata:
  name: teachio-api
  namespace: teachio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teachio-api
  template:
    metadata:
      labels:
        app: teachio-api
    spec:
      containers:
        - name: teachio-api
          image: ghcr.io/OWNER/teachio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: teachio-api-config
            - secretRef:
                name: teachio-api-secrets
          readinessProbe:
            httpGet:
              path: /swagger
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /swagger
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
